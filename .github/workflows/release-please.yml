name: release-please

# ---------------------------------------------------------------------------
# WHY THIS RUNS ON A BUTTON AND NOT ON `push: main`, WHICH IS WHERE IT BELONGS.
#
# release-please's own README says it, and it decides the whole shape of this epic:
#
#   > By default, Release Please uses the built-in `GITHUB_TOKEN` secret. However, all resources
#   > created by `release-please` (release tag or release pull request) will not trigger future
#   > GitHub actions workflows, and workflows normally triggered by `release.created` events will
#   > also not run.
#
# So with the default token the tag this cuts would NOT start `release.yml`, and a release would
# silently produce nothing — the exact failure the plan warned about for the tag SHAPE, arriving
# from a different direction entirely. A no-op that looks like a release is worse than no
# automation, so this does not go on `push: main` until it can actually finish the job.
#
# WHAT IT NEEDS: a token that is not `GITHUB_TOKEN`. The operator chose a GITHUB APP over a PAT on
# 2026-09-18, and the job below is wired for it: the token is MINTED PER RUN from an app
# installation, expires in an hour, and is scoped to the repositories the app is installed on. A
# PAT would have been one long-lived credential with the same rights as the person holding it.
#
# WHAT IS LEFT, and it is not work this repository can do: creating a GitHub App and installing it
# are BROWSER-ONLY operations — GitHub has no REST endpoint that creates an app, and the manifest
# flow still goes through a form and a redirect. The two secrets below are what that produces.
# `todo/PLAN_release_please_meets_a_narrative_changelog.md` in `dew_flow_connect_other_ais` carries
# the manifest, the exact permissions, and the four steps.
#
# TURNING IT ON is then: add the two secrets, uncomment the `push: branches: [main]` trigger, and
# dispatch once to watch a release pull request appear. Everything else here has been reviewed.
# ---------------------------------------------------------------------------

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release · propose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # What the action needs to open and update the release pull request, and to cut the tag when
      # that pull request merges. Narrower than the release workflow's, and — unlike that one —
      # this job is started by a push to main rather than by a tag, so it never runs code a tag
      # points at. That distinction is the subject of Epic 5.
      contents: write
      pull-requests: write
    steps:
      # SAY WHAT IS MISSING, rather than letting the mint below fail on an empty input. Until the
      # app exists these secrets are absent, and `create-github-app-token` answers that with a
      # message about a malformed private key — which reads like a broken secret rather than an
      # absent one, and sends whoever dispatched this looking in the wrong place.
      - name: The app must exist before anything can be minted from it
        env:
          # `secrets` is NOT one of the contexts a step's `if:` can read, so this is a step that
          # always runs and decides in the shell. The PRIVATE KEY never reaches the environment:
          # the expression compares it and hands over `true` or `false`, which is the only thing
          # this step has any business knowing about it.
          APP_ID_SET: ${{ secrets.RELEASE_PLEASE_APP_ID != '' }}
          APP_KEY_SET: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$APP_ID_SET" = "true" ] && [ "$APP_KEY_SET" = "true" ]; then
            echo "release-please: app credentials present."
            exit 0
          fi
          echo "release-please: this repository has no app credentials yet." >&2
          echo "  RELEASE_PLEASE_APP_ID          set: $APP_ID_SET" >&2
          echo "  RELEASE_PLEASE_APP_PRIVATE_KEY set: $APP_KEY_SET" >&2
          echo "  Creating and installing a GitHub App are BROWSER-ONLY steps — GitHub has no REST" >&2
          echo "  endpoint that creates an app. The manifest, the exact permissions and the four" >&2
          echo "  steps are in PLAN_release_please_meets_a_narrative_changelog.md in" >&2
          echo "  dew_flow_connect_other_ais. Nothing here is broken; it is not set up yet." >&2
          exit 1

      # A token that lives for an hour and is scoped to this installation, minted here rather than
      # stored anywhere. This is the whole reason an app was chosen over a PAT: what a leak would
      # cost is bounded by the app's permissions and by the hour, not by whatever the person who
      # minted the PAT happens to have access to.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The plan named v4 because it was written before v5 existed. v5.0.0's only breaking
          # change is the action's own Node runtime (node24); its inputs are unchanged.
          #
          # THE POINT OF THE WHOLE FILE. With `GITHUB_TOKEN` the tag this cuts starts nothing, so
          # the release produces nothing and says nothing. An app installation token is an ordinary
          # actor to GitHub, so `release.yml` runs when the release pull request merges.
          token: ${{ steps.token.outputs.token }}
