name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The execution provider is a COMPILE-TIME feature, so "does it build" is a different question per
# platform. The default feature is `dml` (DirectML), which exists only on Windows — building the
# default set on ubuntu would fail for a reason that says nothing about the code. So: ubuntu builds
# the CPU flavour (--no-default-features), windows builds the default DirectML one.
#
# cuda and migraphx are deliberately NOT built here. Both need a vendor toolchain the runner does
# not have (CUDA Toolkit; ROCm plus an ONNX Runtime built from source with --use_migraphx), and a
# job that cannot install them would only ever report a missing dependency.
permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: "--no-default-features"
            label: cpu
          - os: windows-latest
            features: ""
            label: dml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: ${{ matrix.os }} (${{ matrix.label }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.label }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked ${{ matrix.features }}

      - name: Test
        run: cargo test --release --locked ${{ matrix.features }}

      # ON since 2026-08-19. It was deferred for a reason that had quietly expired: the argument was that
      # reformatting destroys the diff against the sources this crate was carried from — true while the
      # code was one 4 744-line main.rs, and no longer true after the 2026-08-16 split rewrote every file
      # anyway. By then the drift had spread from "790 lines of main.rs" to 233 hunks across 19 files, so
      # waiting only made the eventual commit larger. Applied as its own mechanical commit, as the
      # deferral asked.
      #
      # --package, so the vendored fastembed fork stays byte-identical to upstream — its formatting is
      # upstream's business and a diff against it is what makes the one marked patch reviewable.
      # ubuntu only: formatting does not vary by platform, and running it twice only doubles the ways a
      # green build can go red.
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --package bge-sidecar --check

  # The six routes over the wire, against a running binary: routing, the JSON extractor's refusals,
  # the batch caps and the body limit — which is a LAYER, so nothing below the router can prove one is
  # applied. Runs the CPU flavour on ubuntu and never asks for an inference: an engine build takes the
  # GPU, and gpu-lease.md says a tool claims the card through a lease or not at all.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git submodule update --init --depth 1 .claude/rules/shared

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-latest-cpu-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install the pinned httpyac
        run: npm ci --prefix http

      - name: Start the sidecar and run the suite
        run: |
          cargo build --release --locked --no-default-features
          PORT=5320 ./target/release/bge-sidecar &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:5320/health && break
            sleep 2
          done
          node .claude/rules/shared/tools/http-run.mjs --env local --target http://127.0.0.1:5320

      - name: Every route has a request
        run: node .claude/rules/shared/tools/http-coverage.mjs --source src

      - name: The post-deploy checklist is still well formed
        run: node .claude/rules/shared/tools/post-deploy-check.mjs

  # The plan lifecycle, enforced from the shared rules repository rather than four times over — the check
  # reads markdown, not code, so one implementation serves every consumer (see .claude/rules/shared/README.md).
  # Only that ONE submodule is fetched: `submodules: true` would drag every other one in for a markdown walk.
  # Node is preinstalled on the runner, so a Rust repository pays no toolchain for this.
  plans:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the shared rules
        run: git submodule update --init --depth 1 .claude/rules/shared

      - name: Plan lifecycle
        run: node .claude/rules/shared/tools/plan-lifecycle.mjs
      # The protection `main` is supposed to have is a FILE now — `.github/branch-protection.json` —
      # because branch protection is the one part of a repository's CI that is not IN the repository.
      # Nothing makes GitHub read it; what it buys is that the intent is reviewed, and that the drift
      # from it is something a command prints rather than something nobody finds.
      #
      # This step is the half that needs no token: the comparison logic, against fixtures. It caught
      # three real bugs in that logic the first time it ran. Comparing to the REAL branch needs
      # repository admin, so `node .github/scripts/branch-protection.mjs` is run by hand.
      - name: Branch protection selftest
        run: node .github/scripts/branch-protection.mjs --selftest

      # Every submodule pin must equal its remote's tip — "a rule change and the pin bumps are one
      # task" is a check now, not a habit (see .claude/rules/shared/README.md, Editing discipline).
      # This repo felt the drift first-hand: it was two commits behind and missing gpu-lease.md,
      # despite BEING the GPU. Last of the four consumers to gain the step, only because this file
      # was in another session's hands on the day the other three got it.
      - name: Pin check
        run: node .claude/rules/shared/tools/pin-check.mjs

      # The review-gate block is a shared rule; a copy of it in this repository is the drift the
      # rule exists to prevent. The panel can only see a repo somebody opened in VS Code.
      - name: Gate snippet
        run: node .claude/rules/shared/tools/gate-snippet-check.mjs

      # The root Directory.Build.rsp is really there and really says -nr:false. Measured on this
      # family's machine: five sessions building at once held 72 MSBuild workers and 10.7 GB,
      # because a worker busy in one build cannot be reused by another
      # (see .claude/rules/shared/csharp/dotnet-build.md). A repository with no C# passes without an opinion.
      - name: Build flags
        run: node .claude/rules/shared/tools/build-flags-check.mjs


  # ---------------------------------------------------------------------------
  # The workflows themselves are code, and nothing checked them until now.
  #
  # actionlint reads every file under .github/workflows. The rule that earns its place on its own
  # is the script-injection one: a `${{ }}` expression written inline in a `run:` is pasted into
  # the shell source before bash parses it, and this family has already had to fix that by hand.
  # Separately, because ubuntu runners ship shellcheck, it lints the `run:` blocks as shell.
  #
  # NO NEW ACTION. actionlint publishes none — only a release binary — and every `uses:` line here
  # was just pinned to a commit SHA so the supply chain stays auditable. Pulling in an unpinnable
  # third-party action to get a linter would undo that. The binary is pinned by VERSION and verified
  # by CHECKSUM, which is the same promise a SHA pin makes: what runs is what was reviewed.
  #
  # Measured when this was added: zero in this repository and eighteen across the family, every one of them in a
  # release or deploy workflow, and all eighteen fixed before this job was allowed to fail on them.
  #
  # THE FIRST MEASUREMENT SAID ZERO EVERYWHERE AND WAS WRONG, which is why the step below asserts
  # shellcheck is present before linting. Without it actionlint keeps its OWN rules — the injection
  # check included — and silently drops the shell analysis of every `run:` block. No warning, exit
  # zero, a green check, and eighteen findings left standing.
  workflows:
    name: workflows · actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint every workflow
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          # The dependency this gate is quietly useless without — see the note above the job.
          command -v shellcheck > /dev/null || {
            echo "shellcheck is not on PATH: actionlint would skip every run: block and pass"
            exit 1
          }
          # Retried, because one HTTP 500 from the release host failed an unrelated Dependabot
          # pull request — measured on dew_flow_mcp #23. `--retry-all-errors` is the part that
          # matters: curl retries transport failures on its own, but treats a 500 as a final
          # answer. The checksum below still decides what runs, so this widens the window without
          # widening what is trusted.
          #
          # AND THE WINDOW WAS TWO ORDERS OF MAGNITUDE TOO SHORT, measured on
          # dew_flow_connect_other_ais 2026-09-21: four consecutive 504s between 14:53:19.86 and
          # 14:53:25.89 - 6.08 seconds for the whole budget, because `--retry-delay 2` REPLACES
          # curl's exponential backoff with a flat two seconds. A 504 from a CDN is a server-side
          # outage measured in minutes. The guard was built for exactly this and then given six
          # seconds to do it in, so it failed looking like it worked. Dropping the fixed delay
          # restores the backoff (1, 2, 4, 8, 16 s); `--retry-max-time` is the ceiling.
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-max-time 120 --retry-all-errors \
            -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
