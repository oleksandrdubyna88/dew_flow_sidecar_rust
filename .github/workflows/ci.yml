name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The execution provider is a COMPILE-TIME feature, so "does it build" is a different question per
# platform. The default feature is `dml` (DirectML), which exists only on Windows — building the
# default set on ubuntu would fail for a reason that says nothing about the code. So: ubuntu builds
# the CPU flavour (--no-default-features), windows builds the default DirectML one.
#
# cuda and migraphx are deliberately NOT built here. Both need a vendor toolchain the runner does
# not have (CUDA Toolkit; ROCm plus an ONNX Runtime built from source with --use_migraphx), and a
# job that cannot install them would only ever report a missing dependency.
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: "--no-default-features"
            label: cpu
          - os: windows-latest
            features: ""
            label: dml
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.label }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked ${{ matrix.features }}

      - name: Test
        run: cargo test --release --locked ${{ matrix.features }}

      # No `cargo fmt --check` here yet, deliberately. It was added, it failed on the first run, and the
      # reason is worth writing down rather than papering over: the crate carries pre-existing formatting
      # drift — `cargo fmt --package bge-sidecar` rewrites 790 lines of main.rs and 52 of adapters.rs. That
      # is a decision about this codebase's style, not a side effect a CI file should make on its way past;
      # a reformat that size also destroys the diff against the sources this crate was carried from, which
      # is the one thing making the port reviewable right now.
      #
      # To turn it on: run `cargo fmt --package bge-sidecar` as its own commit, then add
      #   - name: Format check
      #     if: matrix.os == 'ubuntu-latest'
      #     run: cargo fmt --package bge-sidecar --check
      # (--package, so the vendored fastembed fork stays byte-identical to upstream.)
