# Dependabot version updates — grouped, weekly, on Monday morning Kyiv time, one pull request per
# ecosystem so a week of bumps is one review rather than fifteen.
#
# Security updates are separate and immediate (enabled in the repository settings, 2026-09-05).
#
# The `github-actions` entry is the load-bearing one: requirement 9 of the family CI hardening plan
# pins every `uses:` line to a 40-character commit SHA, and a pinned SHA with no bot behind it rots
# into an action that never gets its security fixes — a worse place than the tag it replaced. This
# group is what makes that pinning maintainable, so it exists BEFORE the pinning does.
#
# `vendor-fastembed/` IS DELIBERATELY ABSENT FROM EVERY ENTRY. It is a vendored third-party crate —
# its own LICENSE, its own release workflow, its own `.github/dependabot.yml`, and an entry in
# THIRD-PARTY-NOTICES.md. Pointing the bot at it would propose upgrades that overwrite a copy this
# repository holds on purpose, and the tokenizer work in `research/PLAN_tokenizer_registry.md`
# depends on it staying where it is. (Its own dependabot file is inert: GitHub reads only the one at
# the repository root.)
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Kyiv"
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "cargo"]
    commit-message:
      prefix: "chore(deps)"

  # The `.http` contract suite's toolchain.
  - package-ecosystem: "npm"
    directory: "/http"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Kyiv"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Kyiv"
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
