# Dependabot version updates — grouped, weekly, on Monday morning Kyiv time, one pull request per
# ecosystem so a week of bumps is one review rather than fifteen.
#
# Security updates are separate and immediate (enabled in the repository settings, 2026-09-05).
#
# The `github-actions` entry matters for requirement 9 of the family CI hardening plan, which pins
# every `uses:` line to a 40-character commit SHA. A pin only stays current because a bot proposes
# the next SHA — and it is this ENTRY that enables those updates. The `groups:` block only batches
# them into one pull request, so enabling and pinning may land together; neither has to come first.
# (An earlier draft of this comment said the GROUP had to exist before the pinning. It did not.)
#
# Verified in this family rather than assumed — connect_other_ais PR #14 bumped a SHA-pinned action
# and rewrote the trailing version comment with it:
#   -  uses: amannn/action-semantic-pull-request@e32d7e60… # v5
#   +  uses: amannn/action-semantic-pull-request@48f25628… # v6.1.1
#
# The limit worth knowing: these are scheduled VERSION updates. Dependabot ALERTS do not cover
# SHA-versioned actions, so the "security updates are separate and immediate" line above is NOT a
# safety net for a pinned action — this weekly schedule is the only thing keeping those pins current.
#
# `vendor-fastembed/` IS DELIBERATELY ABSENT FROM EVERY ENTRY. It is a vendored third-party crate —
# its own LICENSE, its own release workflow, its own `.github/dependabot.yml`, and an entry in
# THIRD-PARTY-NOTICES.md. Pointing the bot at it would propose upgrades that overwrite a copy this
# repository holds on purpose, and the tokenizer work in `research/PLAN_tokenizer_registry.md`
# depends on it staying where it is. (Its own dependabot file is inert: GitHub reads only the one at
# the repository root.)
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Kyiv"
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "cargo"]
    commit-message:
      prefix: "chore(deps)"

  # The `.http` contract suite's toolchain.
  - package-ecosystem: "npm"
    directory: "/http"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Kyiv"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Kyiv"
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
